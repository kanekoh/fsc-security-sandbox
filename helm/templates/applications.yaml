{{- /*
  App of Apps — fsc-security-sandbox
  RHACS order (zero-touch): Operator → Central → CRS Job → SecuredCluster
  Component charts are skeletons until the implement session.
*/ -}}
{{- $repo := .Values.gitops.repoUrl -}}
{{- $rev := .Values.gitops.revision -}}
{{- $base := .Values.gitops.basePath -}}
{{- $argoNs := .Values.argocd.namespace -}}
{{- $project := .Values.argocd.project -}}

{{- define "fsc.wave" -}}
{{- $w := . -}}
argocd.argoproj.io/sync-wave: {{ $w | quote }}
{{- end -}}

{{- if .Values.components.rhacsOperator.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-rhacs-operator
  namespace: {{ $argoNs }}
  labels:
    demo.redhat.com/application: "field-content"
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.rhacsOperator.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $project }}
  source:
    repoURL: {{ $repo }}
    targetRevision: {{ $rev }}
    path: {{ $base }}/components/rhacs-operator
    helm:
      valuesObject:
        rhacsOperator: {{ .Values.components.rhacsOperator | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.rhacsOperator.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

