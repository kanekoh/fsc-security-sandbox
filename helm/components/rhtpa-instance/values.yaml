rhtpaInstance:
  enabled: true
  namespace: trusted-profile-analyzer
  # deps: CNPG Cluster + ObjectBucketClaim (ODF MCG). createCR waits for OIDC.
  deps:
    enabled: true
  createCR: false
  name: trustedprofileanalyzer
  cnpg:
    clusterName: rhtpa-db
    instances: 1
    database: tpadb
    owner: tpauser
    storageSize: 20Gi
    storageClass: ""
  mcg:
    # ObjectBucketClaim → openshift-storage.noobaa.io (MCG standalone)
    claimName: trustify-demo
    generateBucketName: trustify-demo
    storageClassName: openshift-storage.noobaa.io
    # Set from ConfigMap rhtpa-storage-endpoint before createCR=true
    endpoint: ""
    bucket: ""
  oidc:
    issuerUrl: ""
    frontendClientId: ""
    cliClientId: ""

deployer:
  domain: ""
