{{- if and .Values.rhtpaInstance.enabled .Values.rhtpaInstance.deps.enabled }}
# Creates DB + MinIO Secrets in-cluster (never committed). Idempotent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhtpa-secret-bootstrap
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhtpa-secret-bootstrap
  namespace: {{ .Values.rhtpaInstance.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhtpa-secret-bootstrap
  namespace: {{ .Values.rhtpaInstance.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhtpa-secret-bootstrap
subjects:
  - kind: ServiceAccount
    name: rhtpa-secret-bootstrap
    namespace: {{ .Values.rhtpaInstance.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhtpa-secret-bootstrap
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: rhtpa-secret-bootstrap
      containers:
        - name: bootstrap
          image: quay.io/openshift/origin-cli:4.17
          env:
            - name: NS
              value: {{ .Values.rhtpaInstance.namespace | quote }}
            - name: BUCKET
              value: {{ .Values.rhtpaInstance.minio.bucket | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              gen() { head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 24; }

              ensure_secret() {
                local name="$1"; shift
                if oc -n "${NS}" get secret "${name}" >/dev/null 2>&1; then
                  echo "secret/${name} exists — keep"
                  return 0
                fi
                oc -n "${NS}" create secret generic "${name}" "$@"
                echo "created secret/${name}"
              }

              USER_PASS="$(gen)"
              ADMIN_PASS="$(gen)"
              ACCESS_KEY="rhtpa$(gen | head -c 8)"
              SECRET_KEY="$(gen)$(gen)"

              ensure_secret postgresql-credentials \
                --from-literal=db.host=rhtpa-postgresql \
                --from-literal=db.port=5432 \
                --from-literal=db.name=tpadb \
                --from-literal=db.user=tpauser \
                --from-literal=db.password="${USER_PASS}"

              ensure_secret postgresql-admin-credentials \
                --from-literal=db.host=rhtpa-postgresql \
                --from-literal=db.port=5432 \
                --from-literal=db.name=tpadb \
                --from-literal=db.user=postgres \
                --from-literal=db.password="${ADMIN_PASS}"

              # Helm/Operator AWS template key names (official Deployment Guide appendix A)
              ensure_secret storage-credentials \
                --from-literal=aws_access_key_id="${ACCESS_KEY}" \
                --from-literal=aws_secret_access_key="${SECRET_KEY}" \
                --from-literal=user="${ACCESS_KEY}" \
                --from-literal=password="${SECRET_KEY}" \
                --from-literal=bucket="${BUCKET}"

              # Placeholder until shared IdP is wired (createCR remains false without real OIDC)
              ensure_secret oidc-cli \
                --from-literal=client-secret="pending-oidc-not-configured"

              echo "bootstrap complete"
{{- end }}
