{{- if and .Values.rhtpaInstance.enabled .Values.rhtpaInstance.deps.enabled }}
# Maps CNPG + OBC credentials into the Secret shapes RHTPA expects (never store secrets in Git).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhtpa-secret-bridge
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhtpa-secret-bridge
  namespace: {{ .Values.rhtpaInstance.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhtpa-secret-bridge
  namespace: {{ .Values.rhtpaInstance.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhtpa-secret-bridge
subjects:
  - kind: ServiceAccount
    name: rhtpa-secret-bridge
    namespace: {{ .Values.rhtpaInstance.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhtpa-secret-bridge
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: rhtpa-secret-bridge
      containers:
        - name: bridge
          image: quay.io/openshift/origin-cli:4.17
          env:
            - name: NS
              value: {{ .Values.rhtpaInstance.namespace | quote }}
            - name: CNPG_CLUSTER
              value: {{ .Values.rhtpaInstance.cnpg.clusterName | quote }}
            - name: OBC_NAME
              value: {{ .Values.rhtpaInstance.mcg.claimName | quote }}
            - name: DB_NAME
              value: {{ .Values.rhtpaInstance.cnpg.database | quote }}
            - name: DB_OWNER
              value: {{ .Values.rhtpaInstance.cnpg.owner | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "Waiting for CNPG secrets (${CNPG_CLUSTER}-app / -superuser)..."
              for i in $(seq 1 60); do
                if oc -n "${NS}" get secret "${CNPG_CLUSTER}-app" "${CNPG_CLUSTER}-superuser" >/dev/null 2>&1; then
                  break
                fi
                sleep 10
              done
              oc -n "${NS}" get secret "${CNPG_CLUSTER}-app" "${CNPG_CLUSTER}-superuser" >/dev/null

              echo "Waiting for OBC Secret/ConfigMap (${OBC_NAME})..."
              for i in $(seq 1 60); do
                if oc -n "${NS}" get secret "${OBC_NAME}" configmap "${OBC_NAME}" >/dev/null 2>&1; then
                  break
                fi
                sleep 10
              done
              oc -n "${NS}" get secret "${OBC_NAME}" configmap "${OBC_NAME}" >/dev/null

              APP_USER="$(oc -n "${NS}" get secret "${CNPG_CLUSTER}-app" -o jsonpath='{.data.username}' | base64 -d)"
              APP_PASS="$(oc -n "${NS}" get secret "${CNPG_CLUSTER}-app" -o jsonpath='{.data.password}' | base64 -d)"
              APP_HOST="$(oc -n "${NS}" get secret "${CNPG_CLUSTER}-app" -o jsonpath='{.data.host}' | base64 -d)"
              APP_PORT="$(oc -n "${NS}" get secret "${CNPG_CLUSTER}-app" -o jsonpath='{.data.port}' | base64 -d)"
              # fallbacks
              APP_HOST="${APP_HOST:-${CNPG_CLUSTER}-rw}"
              APP_PORT="${APP_PORT:-5432}"
              APP_USER="${APP_USER:-${DB_OWNER}}"

              SU_USER="$(oc -n "${NS}" get secret "${CNPG_CLUSTER}-superuser" -o jsonpath='{.data.username}' | base64 -d)"
              SU_PASS="$(oc -n "${NS}" get secret "${CNPG_CLUSTER}-superuser" -o jsonpath='{.data.password}' | base64 -d)"
              SU_USER="${SU_USER:-postgres}"

              # OBC secret keys (NooBaa): AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
              ACCESS="$(oc -n "${NS}" get secret "${OBC_NAME}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
              SECRET="$(oc -n "${NS}" get secret "${OBC_NAME}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"
              BUCKET="$(oc -n "${NS}" get configmap "${OBC_NAME}" -o jsonpath='{.data.BUCKET_NAME}')"
              BHOST="$(oc -n "${NS}" get configmap "${OBC_NAME}" -o jsonpath='{.data.BUCKET_HOST}')"
              BPORT="$(oc -n "${NS}" get configmap "${OBC_NAME}" -o jsonpath='{.data.BUCKET_PORT}')"
              BSSL="$(oc -n "${NS}" get configmap "${OBC_NAME}" -o jsonpath='{.data.BUCKET_SSL}')"
              if [ "${BSSL}" = "true" ] || [ "${BSSL}" = "True" ]; then
                ENDPOINT="https://${BHOST}"
              else
                ENDPOINT="http://${BHOST}"
              fi
              if [ -n "${BPORT}" ] && [ "${BPORT}" != "443" ] && [ "${BPORT}" != "80" ]; then
                ENDPOINT="${ENDPOINT}:${BPORT}"
              fi

              apply_secret() {
                local name="$1"; shift
                oc -n "${NS}" create secret generic "${name}" "$@" --dry-run=client -o yaml | oc apply -f -
              }

              # RHTPA / Helm AWS template keys (Deployment Guide appendix)
              apply_secret postgresql-credentials \
                --from-literal=db.host="${APP_HOST}" \
                --from-literal=db.port="${APP_PORT}" \
                --from-literal=db.name="${DB_NAME}" \
                --from-literal=db.user="${APP_USER}" \
                --from-literal=db.password="${APP_PASS}"

              apply_secret postgresql-admin-credentials \
                --from-literal=db.host="${APP_HOST}" \
                --from-literal=db.port="${APP_PORT}" \
                --from-literal=db.name="${DB_NAME}" \
                --from-literal=db.user="${SU_USER}" \
                --from-literal=db.password="${SU_PASS}"

              # RH services style: user/password + endpoint in region field of CR
              apply_secret storage-credentials \
                --from-literal=aws_access_key_id="${ACCESS}" \
                --from-literal=aws_secret_access_key="${SECRET}" \
                --from-literal=user="${ACCESS}" \
                --from-literal=password="${SECRET}" \
                --from-literal=bucket="${BUCKET}" \
                --from-literal=endpoint="${ENDPOINT}"

              if ! oc -n "${NS}" get secret oidc-cli >/dev/null 2>&1; then
                apply_secret oidc-cli --from-literal=client-secret="pending-oidc-not-configured"
              fi

              # ConfigMap for CR templating / operators
              oc -n "${NS}" create configmap rhtpa-storage-endpoint \
                --from-literal=endpoint="${ENDPOINT}" \
                --from-literal=bucket="${BUCKET}" \
                --dry-run=client -o yaml | oc apply -f -

              echo "bridge complete endpoint=${ENDPOINT} bucket=${BUCKET}"
{{- end }}
