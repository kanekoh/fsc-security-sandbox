{{- if and .Values.rhtpaInstance.enabled .Values.rhtpaInstance.deps.enabled }}
# Demo S3-compatible storage (not ODF). Credentials from bootstrap Job.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rhtpa-minio-data
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    app.kubernetes.io/component: rhtpa-minio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.rhtpaInstance.minio.pvcSize | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: rhtpa-minio
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app: rhtpa-minio
    app.kubernetes.io/part-of: fsc-security-sandbox
spec:
  selector:
    app: rhtpa-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhtpa-minio
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app: rhtpa-minio
    app.kubernetes.io/part-of: fsc-security-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhtpa-minio
  template:
    metadata:
      labels:
        app: rhtpa-minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.rhtpaInstance.minio.image | quote }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: aws_access_key_id
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: aws_secret_access_key
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rhtpa-minio-data
{{- end }}
