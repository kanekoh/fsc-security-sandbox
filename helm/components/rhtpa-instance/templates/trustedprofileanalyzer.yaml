{{- if and .Values.rhtpaInstance.enabled .Values.rhtpaInstance.createCR }}
{{- $ns := .Values.rhtpaInstance.namespace -}}
{{- $domain := .Values.deployer.domain | default "" -}}
{{- $appDomain := printf "-%s.%s" $ns $domain -}}
# Official Operator path: paste Helm RH-services / AWS values under spec.
# storage.region holds the S3 endpoint URL for MCG (RH services template pattern).
# Bridge Job must have created storage-credentials with key "endpoint".
apiVersion: rhtpa.io/v1
kind: TrustedProfileAnalyzer
metadata:
  name: {{ .Values.rhtpaInstance.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    demo.redhat.com/application: "field-content"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  appDomain: {{ $appDomain | quote }}
  ingress:
    className: openshift-default
    additionalAnnotations:
      haproxy.router.openshift.io/timeout: "5m"
  storage:
    type: s3
    # RH services template: region = S3 endpoint URL (MCG). Set mcg.endpoint from ConfigMap rhtpa-storage-endpoint before enable.
    region: {{ required "rhtpaInstance.mcg.endpoint required when createCR=true (oc -n trusted-profile-analyzer get cm rhtpa-storage-endpoint -o jsonpath='{.data.endpoint}')" .Values.rhtpaInstance.mcg.endpoint | quote }}
    bucket: {{ .Values.rhtpaInstance.mcg.bucket | default .Values.rhtpaInstance.mcg.generateBucketName | quote }}
    accessKey:
      valueFrom:
        secretKeyRef:
          name: storage-credentials
          key: user
    secretKey:
      valueFrom:
        secretKeyRef:
          name: storage-credentials
          key: password
  database:
    host:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.host
    port:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.port
    name:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.name
    username:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.user
    password:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.password
  createDatabase:
    name:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.name
    username:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.user
    password:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.password
  migrateDatabase:
    username:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.user
    password:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.password
  modules:
    createDatabase:
      enabled: true
    migrateDatabase:
      enabled: true
  oidc:
    issuerUrl: {{ required "rhtpaInstance.oidc.issuerUrl required when createCR=true" .Values.rhtpaInstance.oidc.issuerUrl | quote }}
    clients:
      frontend:
        clientId: {{ required "rhtpaInstance.oidc.frontendClientId required when createCR=true" .Values.rhtpaInstance.oidc.frontendClientId | quote }}
      cli:
        clientId: {{ required "rhtpaInstance.oidc.cliClientId required when createCR=true" .Values.rhtpaInstance.oidc.cliClientId | quote }}
        clientSecret:
          valueFrom:
            secretKeyRef:
              name: oidc-cli
              key: client-secret
{{- end }}
