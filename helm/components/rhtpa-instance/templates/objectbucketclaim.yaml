{{- if and .Values.rhtpaInstance.enabled .Values.rhtpaInstance.deps.enabled }}
# Requires ODF MCG (StorageClass openshift-storage.noobaa.io).
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ .Values.rhtpaInstance.mcg.claimName }}
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    app.kubernetes.io/component: rhtpa-object-storage
    demo.redhat.com/application: "field-content"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  generateBucketName: {{ .Values.rhtpaInstance.mcg.generateBucketName | quote }}
  storageClassName: {{ .Values.rhtpaInstance.mcg.storageClassName | quote }}
{{- end }}
