{{- if .Values.rhtpaInstance.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhtpa-instance-status
  namespace: {{ .Values.rhtpaInstance.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    app.kubernetes.io/component: rhtpa-instance
    demo.redhat.com/application: "field-content"
data:
  deps: {{ .Values.rhtpaInstance.deps.enabled | quote }}
  createCR: {{ .Values.rhtpaInstance.createCR | quote }}
  storage: "ODF Multicloud Object Gateway (standalone) via ObjectBucketClaim"
  database: "CloudNativePG Cluster"
  status: |
    {{- if .Values.rhtpaInstance.createCR }}
    TrustedProfileAnalyzer CR enabled — requires OIDC clients + bridged Secrets.
    {{- else if .Values.rhtpaInstance.deps.enabled }}
    CNPG + OBC deploying. Bridge Job maps secrets for RHTPA. OIDC still required before createCR=true.
    Official RHTPA: Deployment Guide (Red Hat services / Operator).
    Official ODF: Deploy standalone Multicloud Object Gateway.
    {{- else }}
    Deferred.
    {{- end }}
{{- end }}
