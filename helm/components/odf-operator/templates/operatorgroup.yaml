{{- if .Values.odfOperator.enabled }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-storage-operatorgroup
  namespace: {{ .Values.odfOperator.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
spec:
  targetNamespaces:
    - {{ .Values.odfOperator.namespace }}
{{- end }}
