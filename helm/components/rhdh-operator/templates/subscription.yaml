{{- if .Values.rhdhOperator.enabled }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.rhdhOperator.name }}
  namespace: {{ .Values.rhdhOperator.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    demo.redhat.com/application: "field-content"
spec:
  channel: {{ .Values.rhdhOperator.channel | quote }}
  name: {{ .Values.rhdhOperator.packageName | quote }}
  source: {{ .Values.rhdhOperator.source | quote }}
  sourceNamespace: {{ .Values.rhdhOperator.sourceNamespace | quote }}
  installPlanApproval: {{ .Values.rhdhOperator.installPlanApproval }}
{{- end }}
