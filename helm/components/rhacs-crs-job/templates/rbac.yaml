{{- if .Values.rhacsCrsJob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhacs-crs-bootstrap
  namespace: {{ .Values.rhacsCrsJob.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    demo.redhat.com/application: "field-content"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhacs-crs-bootstrap
  namespace: {{ .Values.rhacsCrsJob.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    demo.redhat.com/application: "field-content"
rules:
  - apiGroups: [""]
    resources: ["secrets", "pods", "pods/log", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["platform.stackrox.io"]
    resources: ["centrals", "securedclusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhacs-crs-bootstrap
  namespace: {{ .Values.rhacsCrsJob.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    demo.redhat.com/application: "field-content"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhacs-crs-bootstrap
subjects:
  - kind: ServiceAccount
    name: rhacs-crs-bootstrap
    namespace: {{ .Values.rhacsCrsJob.namespace }}
{{- end }}
