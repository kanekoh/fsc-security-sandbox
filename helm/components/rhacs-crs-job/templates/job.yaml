{{- if .Values.rhacsCrsJob.enabled }}
# CRS bootstrap Job (zero-touch Secured Cluster registration).
# Generated Secrets stay in-cluster only — never commit them to Git.
apiVersion: batch/v1
kind: Job
metadata:
  name: rhacs-crs-bootstrap
  namespace: {{ .Values.rhacsCrsJob.namespace }}
  labels:
    app.kubernetes.io/part-of: fsc-security-sandbox
    app.kubernetes.io/component: rhacs-crs-job
    demo.redhat.com/application: "field-content"
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fsc-security-sandbox
        app.kubernetes.io/component: rhacs-crs-job
    spec:
      restartPolicy: OnFailure
      serviceAccountName: rhacs-crs-bootstrap
      containers:
        - name: crs-bootstrap
          image: {{ .Values.rhacsCrsJob.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ .Values.rhacsCrsJob.namespace | quote }}
            - name: CRS_NAME
              value: {{ printf "fsc-%s" .Values.rhacsCrsJob.clusterName | quote }}
            - name: WAIT_SECONDS
              value: {{ .Values.rhacsCrsJob.waitSeconds | quote }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.rhacsCrsJob.maxAttempts | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "RHACS CRS bootstrap starting in ${NAMESPACE}"

              # Idempotent: TLS secrets from prior CRS/init-bundle
              if kubectl -n "${NAMESPACE}" get secret sensor-tls >/dev/null 2>&1; then
                echo "sensor-tls already present — CRS already applied"
                exit 0
              fi

              echo "Waiting for deploy/central..."
              attempt=0
              until kubectl -n "${NAMESPACE}" get deploy/central >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
                  echo "Timeout waiting for deploy/central"
                  exit 1
                fi
                sleep "${WAIT_SECONDS}"
              done
              kubectl -n "${NAMESPACE}" rollout status deploy/central --timeout=600s

              echo "Waiting for admin password Secret..."
              attempt=0
              PASS=""
              while [ -z "${PASS}" ]; do
                if kubectl -n "${NAMESPACE}" get secret central-htpasswd >/dev/null 2>&1; then
                  PASS="$(kubectl -n "${NAMESPACE}" get secret central-htpasswd -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)"
                fi
                if [ -z "${PASS}" ] && kubectl -n "${NAMESPACE}" get secret acs-password >/dev/null 2>&1; then
                  PASS="$(kubectl -n "${NAMESPACE}" get secret acs-password -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)"
                fi
                if [ -n "${PASS}" ]; then
                  break
                fi
                attempt=$((attempt + 1))
                if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
                  echo "Timeout waiting for admin password Secret (central-htpasswd / acs-password)"
                  kubectl -n "${NAMESPACE}" get secrets || true
                  exit 1
                fi
                sleep "${WAIT_SECONDS}"
              done

              CRS_UNIQUE="${CRS_NAME}-$(date +%Y%m%d%H%M%S)"
              echo "Generating CRS: ${CRS_UNIQUE}"
              set +e
              printf '%s' "${PASS}" | kubectl -n "${NAMESPACE}" exec -i deploy/central -- \
                bash -c 'ROX_ADMIN_PASSWORD=$(cat) roxctl --insecure-skip-tls-verify central crs generate "'"${CRS_UNIQUE}"'" -o -' \
                | kubectl -n "${NAMESPACE}" apply -f -
              rc=$?
              set -e
              if [ "${rc}" -ne 0 ]; then
                echo "CRS failed (rc=${rc}); falling back to init-bundle (deprecated path)"
                printf '%s' "${PASS}" | kubectl -n "${NAMESPACE}" exec -i deploy/central -- \
                  bash -c 'ROX_ADMIN_PASSWORD=$(cat) roxctl --insecure-skip-tls-verify central init-bundles generate "'"${CRS_UNIQUE}"'" --output-secrets -' \
                  | kubectl -n "${NAMESPACE}" apply -f -
              fi

              if ! kubectl -n "${NAMESPACE}" get secret sensor-tls >/dev/null 2>&1; then
                echo "ERROR: sensor-tls still missing after CRS/init-bundle"
                kubectl -n "${NAMESPACE}" get secrets || true
                exit 1
              fi
              echo "CRS/init-bundle secrets applied successfully"
{{- end }}
